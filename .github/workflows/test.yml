name: Tests

on:
  push:
    branches: ['**']

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test buildFatJar

      # Klogger must be the SLF4J provider in the fat JAR, otherwise Ktor's warnings and errors are lost
      - name: Check SLF4J provider in the fat JAR
        run: test "$(unzip -p build/libs/knot.jar META-INF/services/org.slf4j.spi.SLF4JServiceProvider)" = "bayern.kickner.klogger.slf4j.KloggerServiceProvider"
